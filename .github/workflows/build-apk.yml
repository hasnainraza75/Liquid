name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable could not be detected on PATH."
            exit 1
          fi
          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VERSION_OUTPUT"
          RAW_VERSION="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | head -n 1 | sed -n 's/.*version "\([^"]*\)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to parse active Java version from java -version output."
            exit 1
          fi
          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f1)"
          fi
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected Java major version '$MAJOR_VERSION' is not numeric."
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at ${KEYSTORE_PATH}; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="$(command -v keytool || true)"
            fi
            if [ -z "$KEYTOOL_BIN" ] || [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool could not be found in the configured Java installation."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1
          fi
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Temporary debug keystore could not be created at ${KEYSTORE_PATH}."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ] || [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ] || [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::Expected debug APK is missing or invalid: ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          APK_SIZE="$(wc -c < "$EXPECTED_APK")"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Source APK missing or empty: ${SOURCE_APK}"
            exit 1
          fi
          TEMP_BASE="${RUNNER_TEMP:-/tmp}"
          RELEASE_DIR="$(mktemp -d "${TEMP_BASE}/lux-release-asset.XXXXXX")"
          PREPARED_APK="${RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$PREPARED_APK"
          if [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Failed to copy release APK to temporary runner directory."
            exit 1
          fi
          echo "asset_path=${PREPARED_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset with exact filename: $(basename "$PREPARED_APK")"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_release_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "$PREPARED_APK" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Prepared release APK does not exist or is empty."
            exit 1
          fi
          ASSET_BASENAME="$(basename "$PREPARED_APK")"
          if [[ "$PREPARED_APK" != *.apk ]] || [ "$ASSET_BASENAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk, got: ${ASSET_BASENAME}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes.XXXXXX.md")"
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **APK Asset:** \`app-debug.apk\`

          **Important:**
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$PREPARED_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_apk_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup Actions Artifact: app-debug-apk (available)"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** Normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or did not complete (outcome: ${RELEASE_OUTCOME})."
            if [ "$BUILD_OUTCOME" = "success" ] && [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available as a backup."
              {
                echo "## GitHub Release Publishing Warning"
                echo ""
                echo "The debug APK build **succeeded**, and the GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
                echo ""
                echo "However, publishing to GitHub Releases failed (outcome: \`${RELEASE_OUTCOME}\`). The newly built APK is **not** confirmed to be available at the latest-release direct download URL."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The APK build or artifact upload did not complete (build: ${BUILD_OUTCOME}, artifact: ${ARTIFACT_OUTCOME})."
              {
                echo "## APK Build Incomplete"
                echo ""
                echo "- **Build outcome:** \`${BUILD_OUTCOME}\`"
                echo "- **Artifact upload outcome:** \`${ARTIFACT_OUTCOME}\`"
                echo "- **Release outcome:** \`${RELEASE_OUTCOME}\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
